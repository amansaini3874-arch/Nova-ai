<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }
    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0 25px;
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
    }
    .status {
      font-size: 12px;
      color: #63e6be;
    }
    .welcome {
      text-align: center;
      margin-top: 70px;
    }
    .welcome h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }
    .welcome p {
      color: #aaa;
    }
    .input {
      margin-top: 45px;
      background: #17171d;
      border: 1px solid #30303a;
      border-radius: 20px;
      padding: 18px;
      color: #888;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }
    button {
      padding: 16px;
      border: 0;
      border-radius: 15px;
      background: #1d1d25;
      color: white;
      font-size: 15px;
    }
    button:hover {
      background: #292933;
    }
    .bottom {
      margin-top: 60px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <div class="logo">✦ Nova AI</div>
      <div class="status">● Online</div>
    </div>

    <div class="welcome">
      <h1>How can I help?</h1>
      <p>Your AI assistant for chat, images, voice and creation.</p>

      <div class="input">
        Ask Nova anything...
      </div>

      <div class="buttons">
        <button>💬 Chat</button>
        <button>🖼️ Image</button>
        <button>🎙️ Voice</button>
        <button>🎬 Create</button>
      </div>
    </div>

    <div class="bottom">
      Nova AI • Your creative AI assistant
    </div>

  </div>
</body>
</html>
